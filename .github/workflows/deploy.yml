name: Deploy producao

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Connection string de producao
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          URL=$(npx neonctl connection-string --project-id "$NEON_PROJECT_ID" --pooled)
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Aplicar migrations em producao
        env:
          DATABASE_URL: ${{ steps.neon.outputs.url }}
        run: npx drizzle-kit migrate

      - run: npm run build

      # O --secrets-file e obrigatorio aqui, nao opcional. Os secrets do Worker
      # sao compartilhados entre versoes: um `versions upload --secrets-file` de
      # um PR grava a DATABASE_URL daquela branch no Worker, e um `wrangler deploy`
      # sem --secrets-file herda esse valor. Como a branch do PR e apagada no
      # cleanup, producao passaria a apontar para um banco inexistente.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.neon.outputs.url }}
        run: |
          jq -n --arg u "$DATABASE_URL" '{DATABASE_URL:$u}' > secrets.json
          npx wrangler deploy --secrets-file secrets.json
          rm secrets.json
